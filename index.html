<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Day Night Simulation</title>

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}
canvas{
    position:fixed;
    inset:0;
    z-index:1;
}
.cloud{
    position:fixed;
    z-index:2;
    opacity:0;
    pointer-events:none;
    transition:
        transform 1.6s ease,
        opacity 1.2s ease;
}
.cloud.left{
    left:0;
    transform:translateX(-120%);
}
.cloud.right{
    right:0;
    transform:translateX(120%);
}
.cloud.top{ top:0; width:47%; }
.cloud.middle{ top:22%; width:55%; }
.cloud.bottom{ top:40%; width:51%; }
.cloud.show.left,
.cloud.show.right{
    transform:translateX(0);
    opacity:0.95;
}
#foreground{
    position:fixed;
    left:0;
    top:42%;
    width:100%;
    transform:translateY(-50%);
    z-index:3;
    pointer-events:none;
}
#mask{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:0;
    background:black;
    z-index:2;
}
#ui{
    position:fixed;
    bottom:30px;
    width:100%;
    text-align:center;
    z-index:4;
}
#title{
    margin-bottom:24px;
    font-size:48px;
    letter-spacing:10px;
    color:white;
    opacity:0.9;
    text-shadow:
        0 0 15px rgba(255,255,255,0.5),
        0 0 35px rgba(79,172,254,0.45);
}
button{
    padding:14px 36px;
    font-size:16px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    box-shadow:
        0 0 15px rgba(79,172,254,0.6),
        0 0 40px rgba(0,242,254,0.3);
    transition:0.3s;
}
button:hover{ transform:translateY(-2px); }
button:active{ transform:scale(0.96); }
#sun, #moon{
    position:fixed;
    width:80px;
    height:80px;
    transform:translate(-50%, -50%);
    z-index:1;
    pointer-events:none;
    opacity:1;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<img class="cloud left top" src="awan1.jpg">
<img class="cloud left middle" src="awan2.jpg">
<img class="cloud left bottom" src="awan3.jpg">
<img class="cloud right middle" src="kawan2.jpg">
<img class="cloud right bottom" src="kawan3.jpg">

<img id="sun" src="Sun.png">
<img id="moon" src="moon.png">

<div id="mask"></div>
<img id="foreground" src="g.png">

<div id="ui">
    <div id="title">FIQRI</div>
    <button id="toggle">DAY ⇄ NIGHT</button>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const fgImg = document.getElementById("foreground");
const mask = document.getElementById("mask");
const clouds = document.querySelectorAll(".cloud");
const sun = document.getElementById("sun");
const moon = document.getElementById("moon");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    updateMask();
}
addEventListener("resize", resize);
resize();

function updateMask(){
    const rect = fgImg.getBoundingClientRect();
    const maskHeight = innerHeight - (rect.top + rect.height);
    mask.style.height = Math.max(0, maskHeight) + "px";
}

let isDay = true;
let t = 1;
document.getElementById("toggle").onclick = ()=> isDay = !isDay;

const stars=[];
for(let i=0;i<300;i++){
    stars.push({
        x:Math.random(),
        y:Math.random(),
        r:Math.random()*1.5+0.3,
        p:Math.random()*6.28
    });
}

function lerp(a,b,t){return a+(b-a)*t;}
function rgb(a,b,c){return `rgb(${a|0},${b|0},${c|0})`;}

function updateSunMoon(){
    const sunX = canvas.width/2;
    const sunY = lerp(canvas.height*0.76, canvas.height*0.2, t);
    const moonX = canvas.width/2;
    const moonY = lerp(canvas.height*0.76, canvas.height*0.2, 1-t);

    sun.style.top = sunY + "px";
    sun.style.left = sunX + "px";
    sun.style.opacity = t;

    moon.style.top = moonY + "px";
    moon.style.left = moonX + "px";
    moon.style.opacity = 1-t;
}

function draw(){
    t += ((isDay?1:0)-t)*0.045;

    const g=ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0,rgb(lerp(10,135,t),lerp(15,206,t),lerp(40,235,t)));
    g.addColorStop(1,rgb(lerp(0,180,t),lerp(0,230,t),lerp(10,255,t)));
    ctx.fillStyle=g;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if(t<0.8){
        ctx.globalAlpha=1-t;
        ctx.fillStyle="white";
        for(let s of stars){
            s.p+=0.02;
            ctx.beginPath();
            ctx.arc(
                s.x*canvas.width,
                s.y*canvas.height,
                s.r*(Math.sin(s.p)*0.5+1),
                0,Math.PI*2
            );
            ctx.fill();
        }
        ctx.globalAlpha=1;
    }

    if(t > 0.6){
        clouds.forEach(c=>c.classList.add("show"));
    }else{
        clouds.forEach(c=>c.classList.remove("show"));
    }

    updateMask();
    updateSunMoon();
    requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
